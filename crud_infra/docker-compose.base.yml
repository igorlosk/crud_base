version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: crud_base
    environment:
      POSTGRES_DB: crud_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crud_base"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - crud_base_pg_data:/var/lib/postgresql/data

volumes:
  crud_base_pg_data:
